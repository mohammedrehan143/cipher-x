<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f0f0f; overflow: hidden; }
    .new { font-family: 'Segoe UI', sans-serif; font-size: 6rem; font-weight: 900; display: flex; gap: 8px; }
    .new span {
      display: inline-block;
      opacity: 0;
      animation: pop 0.5s ease forwards, glow 2s ease-in-out infinite alternate, pulse 1.5s ease-in-out infinite;
    }
    .new span:nth-child(1) { color: #00f0ff; animation-delay: 0s, 0.5s, 0.5s; text-shadow: 0 0 10px #00f0ff, 0 0 40px #00f0ff; }
    .new span:nth-child(2) { color: #00c6ff; animation-delay: 0.15s, 0.65s, 0.65s; text-shadow: 0 0 10px #00c6ff, 0 0 40px #00c6ff; }
    .new span:nth-child(3) { color: #0072ff; animation-delay: 0.3s, 0.8s, 0.8s; text-shadow: 0 0 10px #0072ff, 0 0 40px #0072ff; }
    @keyframes pop {
      0% { opacity: 0; transform: translateY(60px) scale(0.3) rotate(-10deg); }
      60% { transform: translateY(-10px) scale(1.1) rotate(3deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }
    @keyframes glow {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.4); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .badge {
      position: absolute;
      top: 20%;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0;
      animation: badgeIn 0.6s 1s ease forwards, badgeBounce 2s 1.6s ease-in-out infinite;
    }
    @keyframes badgeIn {
      0% { opacity: 0; transform: scale(0) rotate(-20deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
  </style>
</head>
<body>
  <div>
    <div class="new" id="text"></div>
    <div class="badge">Just Dropped</div>
  </div>
  <script>
    const word = "NEW";
    const el = document.getElementById("text");
    word.split("").forEach((ch) => {
      const span = document.createElement("span");
      span.textContent = ch;
      el.appendChild(span);
    });
  </script>
</body>
</html>
