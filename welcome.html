<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f0f0f; overflow: hidden; }
    .welcome { font-family: 'Segoe UI', sans-serif; font-size: 4rem; font-weight: 700; color: #fff; }
    .welcome span { display: inline-block; opacity: 0; animation: pop 0.6s ease forwards; }
    @keyframes pop { 0% { opacity: 0; transform: translateY(40px) scale(0.5); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .line { width: 0; height: 3px; background: linear-gradient(90deg, #00c6ff, #0072ff); margin-top: 12px; animation: grow 0.8s 1.4s ease forwards; }
    @keyframes grow { to { width: 100%; } }
  </style>
</head>
<body>
  <div>
    <div class="welcome" id="text"></div>
    <div class="line"></div>
  </div>
  <script>
    const word = "Welcome!";
    const el = document.getElementById("text");
    word.split("").forEach((ch, i) => {
      const span = document.createElement("span");
      span.textContent = ch === " " ? "\u00A0" : ch;
      span.style.animationDelay = `${i * 0.1}s`;
      el.appendChild(span);
    });
  </script>
</body>
</html>
