[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-x"
version = "0.1.0"
description = "CIPHER-X Space-Tech Satellite Land Change Detection & Classification System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scikit-image",
    "scipy",
    "matplotlib",
    "opencv-python",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "streamlit",
    "pydeck",
    "folium",
    "streamlit-folium",
    "python-dotenv",
    "requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]
