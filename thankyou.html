<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f0f0f; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    .container { text-align: center; }
    .text { font-size: 5rem; font-weight: 700; color: #fff; }
    .text span { display: inline-block; opacity: 0; animation: rise 0.6s ease forwards; }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(60px) scale(0.4); filter: blur(8px); }
      60% { filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .subtitle { font-size: 1.2rem; color: #aaa; margin-top: 10px; opacity: 0; animation: fadeUp 0.8s 2s ease forwards; letter-spacing: 4px; text-transform: uppercase; }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .line { width: 0; height: 3px; background: linear-gradient(90deg, #ff6ec7, #ffd93d, #6ec6ff); margin: 16px auto 0; border-radius: 2px; animation: grow 0.8s 2.2s ease forwards; }
    @keyframes grow { to { width: 100%; } }
    canvas#particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <div class="text" id="text"></div>
    <div class="subtitle">for your time</div>
    <div class="line"></div>
  </div>
  <script>
    const word = "Thank You!";
    const el = document.getElementById("text");
    word.split("").forEach((ch, i) => {
      const span = document.createElement("span");
      span.textContent = ch === " " ? "\u00A0" : ch;
      span.style.animationDelay = `${i * 0.1}s`;
      el.appendChild(span);
    });

    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    const colors = ["#ff6ec7", "#ffd93d", "#6ec6ff", "#a78bfa", "#f472b6"];

    class Particle {
      constructor() { this.reset(); this.y = Math.random() * canvas.height; }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 10;
        this.r = Math.random() * 3 + 1;
        this.vy = -(Math.random() * 1.5 + 0.5);
        this.vx = (Math.random() - 0.5) * 0.8;
        this.alpha = Math.random() * 0.6 + 0.4;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.life = 0;
        this.maxLife = Math.random() * 120 + 80;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life++;
        if (this.life > this.maxLife || this.y < -10) this.reset();
      }
      draw() {
        const fade = 1 - this.life / this.maxLife;
        ctx.globalAlpha = this.alpha * fade;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    for (let i = 0; i < 80; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
